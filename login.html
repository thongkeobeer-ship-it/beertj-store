<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ເຂົ້າສູ່ລະບົບ</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gx-signal:#5b8cff;
    --gx-signal-soft:rgba(91,140,255,0.35);
    --gx-signal-dim:rgba(91,140,255,0.16);
    --gx-danger:#ff5470;
    --gx-success:#3ddc84;
    --gx-font:'Chakra Petch', 'Noto Sans Thai', sans-serif;
  }

  /* ===== circuit grid + scanline atmosphere (layers under .ambient-glow orbs) ===== */
  .gx-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(91,140,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,140,255,0.06) 1px, transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 20%, #000 0%, transparent 75%);
            mask-image:radial-gradient(ellipse 70% 55% at 50% 20%, #000 0%, transparent 75%);
    opacity:0.8;
  }
  .gx-scanline{
    position:fixed;left:0;right:0;height:140px;z-index:1;pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(91,140,255,0.05) 45%, rgba(91,140,255,0.09) 50%, rgba(91,140,255,0.05) 55%, transparent);
    animation:gxScan 7s linear infinite;
  }
  @keyframes gxScan{
    0%{top:-140px;}
    100%{top:100vh;}
  }
  @media (prefers-reduced-motion: reduce){
    .gx-scanline{animation:none;display:none;}
  }

  .wrap{position:relative;z-index:2;}

  .back-btn{transition:border-color .2s ease, box-shadow .2s ease, transform .15s ease;}
  .back-btn:hover{border-color:var(--gx-signal-soft);box-shadow:0 0 0 3px var(--gx-signal-dim);}
  .back-btn:active{transform:scale(0.94);}
  .page-title{font-family:var(--gx-font);letter-spacing:0.4px;}

  /* ===== signature: scanning-perimeter card ===== */
  .gx-card{
    position:relative;
    max-width:420px;margin:8px auto 0;
    border-radius:20px;
    padding:2px;
    background:conic-gradient(from var(--gx-angle,0deg),
      transparent 0%, transparent 78%, var(--gx-signal) 88%, var(--shine) 92%, var(--gx-signal) 96%, transparent 100%);
    animation:gxRotate 5.5s linear infinite;
  }
  @keyframes gxRotate{
    to{ --gx-angle:360deg; }
  }
  @property --gx-angle{
    syntax:'<angle>';
    inherits:false;
    initial-value:0deg;
  }
  @media (prefers-reduced-motion: reduce){
    .gx-card{animation:none;background:rgba(154,154,164,0.25);}
  }
  .gx-card-inner{
    position:relative;
    border-radius:18px;
    background:linear-gradient(165deg, rgba(17,28,56,0.92), rgba(5,9,20,0.97));
    border:1px solid rgba(154,154,164,0.1);
    padding:30px 24px 26px;
    overflow:hidden;
  }
  .gx-card-inner::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 5px);
  }

  /* ===== power core ===== */
  .gx-core{
    width:58px;height:58px;margin:0 auto 16px;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .gx-core-ring{
    position:absolute;inset:0;border-radius:50%;
    border:1px solid rgba(91,140,255,0.35);
    animation:gxPulseRing 2.6s ease-out infinite;
  }
  .gx-core-ring.d2{animation-delay:.9s;}
  @keyframes gxPulseRing{
    0%{transform:scale(0.72);opacity:0.9;}
    100%{transform:scale(1.5);opacity:0;}
  }
  .gx-core-body{
    width:44px;height:44px;border-radius:50%;position:relative;z-index:1;
    background:linear-gradient(135deg,var(--black-300),var(--black-500));
    border:1px solid rgba(91,140,255,0.5);
    box-shadow:0 0 18px -2px var(--gx-signal-soft), inset 0 0 10px rgba(91,140,255,0.15);
    display:flex;align-items:center;justify-content:center;
  }
  .gx-core-body svg{width:20px;height:20px;stroke:var(--shine);}
  @media (prefers-reduced-motion: reduce){ .gx-core-ring{animation:none;display:none;} }

  .gx-title{
    font-family:var(--gx-font);font-weight:700;font-size:20px;
    text-align:center;margin:0 0 4px;letter-spacing:0.3px;
  }
  .gx-sub{
    text-align:center;font-size:12.5px;color:var(--ink-500);margin:0 0 22px;
    letter-spacing:0.4px;
  }

  /* one-shot glitch flicker on load */
  .gx-glitch{position:relative;display:inline-block;animation:gxGlitchMain .6s ease .15s 1 both;}
  .gx-glitch::before,.gx-glitch::after{
    content:attr(data-text);position:absolute;left:0;top:0;width:100%;
    overflow:hidden;opacity:0;
  }
  .gx-glitch::before{color:var(--gx-signal);animation:gxGlitchA .6s ease .15s 1 both;}
  .gx-glitch::after{color:var(--gx-danger);animation:gxGlitchB .6s ease .15s 1 both;}
  @keyframes gxGlitchMain{
    0%,100%{transform:translate(0,0);}
    20%{transform:translate(-1px,0);}
    40%{transform:translate(1px,0);}
    60%{transform:translate(-1px,0);}
  }
  @keyframes gxGlitchA{
    0%,100%{opacity:0;transform:translate(0,0);}
    18%{opacity:.7;transform:translate(2px,-1px);clip-path:inset(0 0 60% 0);}
    36%{opacity:0;}
  }
  @keyframes gxGlitchB{
    0%,100%{opacity:0;transform:translate(0,0);}
    24%{opacity:.7;transform:translate(-2px,1px);clip-path:inset(40% 0 0 0);}
    42%{opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){
    .gx-glitch,.gx-glitch::before,.gx-glitch::after{animation:none;}
  }

  /* ===== google button ===== */
  .gx-google-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);
    background:#fff;color:#1f1f1f;font-weight:700;font-size:.92rem;cursor:pointer;
    font-family:var(--gx-font);
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .gx-google-btn:hover{box-shadow:0 0 0 3px var(--gx-signal-dim);}
  .gx-google-btn:active{transform:scale(0.98);}
  .gx-google-btn:disabled{opacity:.7;cursor:default;}
  .gx-google-btn svg.gmark{width:18px;height:18px;}

  .gx-divider{
    display:flex;align-items:center;gap:12px;margin:18px 0;
    font-size:11px;color:var(--ink-500);letter-spacing:0.6px;
    font-family:var(--gx-font);
  }
  .gx-divider::before,.gx-divider::after{content:'';flex:1;height:1px;background:rgba(154,154,164,0.18);}

  /* ===== tabs with sliding indicator ===== */
  .gx-tabs{
    position:relative;display:flex;
    border:1px solid rgba(154,154,164,0.18);
    border-radius:12px;padding:4px;margin-bottom:20px;
    background:rgba(255,255,255,0.02);
  }
  .gx-tab-slider{
    position:absolute;top:4px;bottom:4px;left:4px;
    width:calc(50% - 4px);border-radius:9px;
    background:linear-gradient(135deg,var(--black-300),var(--black-500));
    border:1px solid rgba(91,140,255,0.4);
    box-shadow:0 0 14px -3px var(--gx-signal-soft);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
  }
  .gx-tab{
    position:relative;z-index:1;flex:1;text-align:center;padding:9px 6px;
    font-family:var(--gx-font);font-weight:600;font-size:13.5px;letter-spacing:0.3px;
    color:var(--ink-500);cursor:pointer;transition:color .2s ease;
  }
  .gx-tab.active{color:var(--shine);}

  /* ===== fields ===== */
  .gx-field{margin-bottom:14px;}
  .gx-field label{
    display:flex;align-items:center;gap:6px;
    margin-bottom:6px;font-size:11.5px;color:var(--ink-300);
    font-family:var(--gx-font);letter-spacing:0.5px;text-transform:uppercase;
  }
  .gx-field label svg{width:13px;height:13px;stroke:var(--shine-dim);}
  .gx-input-wrap{position:relative;}
  .gx-input-wrap input{
    width:100%;padding:12px 40px 12px 14px;border-radius:10px;
    border:1px solid rgba(154,154,164,0.16);
    background:rgba(255,255,255,0.02);color:var(--ink-100);font-size:0.95rem;
    font-family:'Noto Sans Thai', sans-serif;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .gx-input-wrap input::placeholder{color:var(--ink-500);}
  .gx-input-wrap input:focus{
    outline:none;border-color:var(--gx-signal);
    box-shadow:0 0 0 3px var(--gx-signal-dim);
  }
  .gx-input-icon{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;color:var(--ink-500);pointer-events:none;
  }
  .gx-input-icon svg{width:100%;height:100%;stroke:currentColor;}
  .gx-toggle-eye{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border:none;background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--ink-500);
    padding:0;
  }
  .gx-toggle-eye:hover{color:var(--shine-dim);}
  .gx-toggle-eye svg{width:17px;height:17px;stroke:currentColor;}

  /* ===== submit button ===== */
  .gx-submit{
    position:relative;overflow:hidden;
    width:100%;margin-top:6px;border:none;border-radius:12px;padding:13px;
    background:linear-gradient(135deg,var(--black-300),var(--black-500));
    color:var(--shine);font-weight:700;font-size:14.5px;
    font-family:var(--gx-font);letter-spacing:0.5px;
    border:1px solid rgba(91,140,255,0.35);
    cursor:pointer;transition:transform .15s ease, box-shadow .2s ease;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .gx-submit:hover{box-shadow:0 0 20px -4px var(--gx-signal-soft);}
  .gx-submit:active{transform:scale(0.98);}
  .gx-submit::after{
    content:"";position:absolute;top:-50%;left:-60%;width:40%;height:200%;
    background:linear-gradient(75deg, transparent 0%, rgba(255,255,255,0.16) 45%, rgba(255,255,255,0.02) 55%, transparent 100%);
    transform:rotate(10deg);animation:gxSweep 3.2s ease-in-out infinite;
  }
  @keyframes gxSweep{
    0%{left:-60%;} 55%{left:130%;} 100%{left:130%;}
  }
  @media (prefers-reduced-motion: reduce){ .gx-submit::after{animation:none;display:none;} }
  .gx-submit:disabled{opacity:.75;cursor:default;}
  .gx-submit:disabled::after{display:none;}

  .gx-spinner{
    width:15px;height:15px;border-radius:50%;
    border:2px solid rgba(232,232,238,0.25);
    border-top-color:var(--shine);
    animation:gxSpin .7s linear infinite;
    display:none;
  }
  @keyframes gxSpin{to{transform:rotate(360deg);}}
  .gx-submit.loading .gx-spinner{display:inline-block;}
  .gx-submit.loading .gx-submit-label{opacity:.6;}

  /* ===== message row ===== */
  .gx-msg{
    display:flex;align-items:center;gap:7px;justify-content:center;
    margin-top:14px;font-size:13px;min-height:1.4em;
    opacity:0;transform:translateY(-4px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .gx-msg.show{opacity:1;transform:translateY(0);}
  .gx-msg svg{width:15px;height:15px;flex-shrink:0;}
  .gx-msg.error{color:var(--gx-danger);}
  .gx-msg.success{color:var(--gx-success);}
  .gx-msg.pending{color:var(--ink-300);}

  /* ===== particle burst on success ===== */
  .gx-burst-layer{
    position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:5;
  }
  .gx-spark{
    position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;
    background:var(--gx-signal);
    box-shadow:0 0 6px 1px var(--gx-signal-soft);
    animation:gxBurst .75s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes gxBurst{
    to{ transform:translate(var(--gx-dx), var(--gx-dy)) scale(0); opacity:0; }
  }
</style>
</head>
<body>
<div class="ambient-glow">
  <div class="orb orb-gold"></div>
  <div class="orb orb-navy"></div>
  <div class="orb orb-gold-soft"></div>
</div>
<div class="gx-grid"></div>
<div class="gx-scanline"></div>

<div class="wrap">

  <div class="back-row">
    <button class="back-btn" id="backBtn" aria-label="ກັບຄືນ">←</button>
    <h1 class="page-title">ບັນຊີຂອງຂ້ອຍ</h1>
  </div>

  <div class="gx-card">
    <div class="gx-card-inner">

      <div class="gx-core">
        <div class="gx-core-ring"></div>
        <div class="gx-core-ring d2"></div>
        <div class="gx-core-body">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
        </div>
      </div>

      <h2 class="gx-title"><span class="gx-glitch" data-text="ເຂົ້າສູ່ລະບົບຜູ້ຫຼິ້ນ">ເຂົ້າສູ່ລະບົບຜູ້ຫຼິ້ນ</span></h2>
      <p class="gx-sub">ຢືນຢັນຕົວຕົນເພື່ອເຂົ້າສູ່ບັນຊີຂອງທ່ານ</p>

      <button type="button" class="gx-google-btn" id="googleBtn">
        <svg class="gmark" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.4 5.9 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.4 5.9 29.5 4 24 4c-7.6 0-14.2 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-1.8 13.9-5l-6.4-5.4c-2 1.4-4.6 2.4-7.5 2.4-5.3 0-9.8-3.4-11.4-8.1l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.7 2.1-2.1 3.9-3.9 5.2l6.4 5.4C41.4 36 44 30.6 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        ເຂົ້າສູ່ລະບົບດ້ວຍ Google
      </button>

      <div class="gx-divider">ຫຼືໃຊ້ອີເມວ</div>

      <div class="gx-tabs">
        <div class="gx-tab-slider" id="tabSlider"></div>
        <div class="gx-tab active" id="tabLogin">ເຂົ້າສູ່ລະບົບ</div>
        <div class="gx-tab" id="tabRegister">ສະໝັກສະມາຊິກ</div>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm">
        <div class="gx-field">
          <label for="loginEmail">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            ອີເມວ
          </label>
          <div class="gx-input-wrap">
            <input type="email" id="loginEmail" required placeholder="you@example.com">
            <span class="gx-input-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
          </div>
        </div>
        <div class="gx-field">
          <label for="loginPassword">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            ລະຫັດຜ່ານ
          </label>
          <div class="gx-input-wrap">
            <input type="password" id="loginPassword" required placeholder="••••••••">
            <button type="button" class="gx-toggle-eye" data-target="loginPassword" aria-label="ສະແດງ/ເຊື່ອງລະຫັດຜ່ານ">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="gx-submit" id="loginSubmit">
          <span class="gx-spinner"></span>
          <span class="gx-submit-label">ເຂົ້າສູ່ລະບົບ</span>
        </button>
        <div class="gx-msg" id="loginMsg"></div>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" style="display:none">
        <div class="gx-field">
          <label for="regEmail">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            ອີເມວ
          </label>
          <div class="gx-input-wrap">
            <input type="email" id="regEmail" required placeholder="you@example.com">
            <span class="gx-input-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
          </div>
        </div>
        <div class="gx-field">
          <label for="regPassword">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            ລະຫັດຜ່ານ (ຢ່າງໜ້ອຍ 6 ໂຕອັກສອນ)
          </label>
          <div class="gx-input-wrap">
            <input type="password" id="regPassword" required minlength="6" placeholder="••••••••">
            <button type="button" class="gx-toggle-eye" data-target="regPassword" aria-label="ສະແດງ/ເຊື່ອງລະຫັດຜ່ານ">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="gx-field">
          <label for="regPassword2">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 12 2 2 4-4"/><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            ຢືນຢັນລະຫັດຜ່ານ
          </label>
          <div class="gx-input-wrap">
            <input type="password" id="regPassword2" required minlength="6" placeholder="••••••••">
            <button type="button" class="gx-toggle-eye" data-target="regPassword2" aria-label="ສະແດງ/ເຊື່ອງລະຫັດຜ່ານ">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="gx-submit" id="registerSubmit">
          <span class="gx-spinner"></span>
          <span class="gx-submit-label">ສະໝັກສະມາຊິກ</span>
        </button>
        <div class="gx-msg" id="registerMsg"></div>
      </form>

      <div class="gx-burst-layer" id="burstLayer"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const ICON_EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 4.22-5.06M9.9 4.24A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a20.5 20.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
  const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg>';
  const ICON_ERR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>';

  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', () => { window.location.href = 'index.html'; });

  // ---- password visibility toggles ----
  document.querySelectorAll('.gx-toggle-eye').forEach(btn => {
    btn.innerHTML = ICON_EYE;
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      if (!input) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = show ? ICON_EYE_OFF : ICON_EYE;
    });
  });

  // ---- tabs ----
  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const tabSlider = document.getElementById('tabSlider');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');

  tabLogin.addEventListener('click', () => {
    tabLogin.classList.add('active');
    tabRegister.classList.remove('active');
    tabSlider.style.transform = 'translateX(0%)';
    loginForm.style.display = 'block';
    registerForm.style.display = 'none';
  });
  tabRegister.addEventListener('click', () => {
    tabRegister.classList.add('active');
    tabLogin.classList.remove('active');
    tabSlider.style.transform = 'translateX(100%)';
    registerForm.style.display = 'block';
    loginForm.style.display = 'none';
  });

  // ---- helpers ----
  function setMsg(el, text, kind) {
    el.classList.remove('show', 'error', 'success', 'pending');
    if (!text) return;
    const icon = kind === 'error' ? ICON_ERR : kind === 'success' ? ICON_OK : '';
    el.innerHTML = icon + '<span>' + text + '</span>';
    el.classList.add('show', kind);
  }
  function setLoading(btn, loading) {
    btn.disabled = loading;
    btn.classList.toggle('loading', loading);
  }
  function burst(originEl) {
    const layer = document.getElementById('burstLayer');
    if (!layer || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const rect = originEl.getBoundingClientRect();
    const parentRect = layer.getBoundingClientRect();
    const cx = rect.left - parentRect.left + rect.width / 2;
    const cy = rect.top - parentRect.top + rect.height / 2;
    for (let i = 0; i < 16; i++) {
      const s = document.createElement('span');
      s.className = 'gx-spark';
      const angle = (Math.PI * 2 * i) / 16;
      const dist = 60 + Math.random() * 40;
      s.style.setProperty('--gx-dx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--gx-dy', Math.sin(angle) * dist + 'px');
      s.style.left = cx + 'px';
      s.style.top = cy + 'px';
      layer.appendChild(s);
      s.addEventListener('animationend', () => s.remove());
    }
  }

  // ---- redirect if already logged in ----
  function redirectAfterAuth() {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');
    window.location.href = redirect || 'index.html';
  }
  getCurrentUser().then(user => { if (user) redirectAfterAuth(); });

  // ---- Google OAuth ----
  const googleBtn = document.getElementById('googleBtn');
  googleBtn.addEventListener('click', async () => {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect') || 'index.html';
    googleBtn.disabled = true;
    googleBtn.textContent = 'ກຳລັງພາໄປ Google...';
    const { error } = await signInWithGoogle(redirect);
    if (error) {
      setMsg(document.getElementById('loginMsg'), 'ເຂົ້າສູ່ລະບົບດ້ວຍ Google ບໍ່ສຳເລັດ: ' + error.message, 'error');
      googleBtn.disabled = false;
      googleBtn.textContent = 'ເຂົ້າສູ່ລະບົບດ້ວຍ Google';
    }
  });

  // ---- Login ----
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('loginMsg');
    const btn = document.getElementById('loginSubmit');
    setMsg(msg, 'ກຳລັງເຂົ້າສູ່ລະບົບ...', 'pending');
    setLoading(btn, true);

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    const { error } = await signIn(email, password);
    setLoading(btn, false);
    if (error) {
      setMsg(msg, 'ເຂົ້າສູ່ລະບົບບໍ່ສຳເລັດ: ' + error.message, 'error');
    } else {
      setMsg(msg, 'ເຂົ້າສູ່ລະບົບສຳເລັດ ກຳລັງພາໄປ...', 'success');
      burst(btn);
      setTimeout(redirectAfterAuth, 450);
    }
  });

  // ---- Register ----
  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('registerMsg');
    const btn = document.getElementById('registerSubmit');
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const password2 = document.getElementById('regPassword2').value;

    if (password !== password2) {
      setMsg(msg, 'ລະຫັດຜ່ານທັງສອງຊ່ອງບໍ່ກົງກັນ', 'error');
      return;
    }

    setMsg(msg, 'ກຳລັງສະໝັກສະມາຊິກ...', 'pending');
    setLoading(btn, true);

    const { error } = await signUp(email, password);
    setLoading(btn, false);
    if (error) {
      setMsg(msg, 'ສະໝັກສະມາຊິກບໍ່ສຳເລັດ: ' + error.message, 'error');
    } else {
      setMsg(msg, 'ສະໝັກສຳເລັດ! ຖ້າເປີດການຢືນຢັນອີເມວໄວ້ ກະລຸນາກວດເບິ່ງອີເມວກ່ອນເຂົ້າສູ່ລະບົບ', 'success');
      burst(btn);
    }
  });
});
</script>
</body>
</html>
