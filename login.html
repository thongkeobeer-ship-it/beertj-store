<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ເຂົ້າສູ່ລະບົບ</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== flat black theme override (login page only) ===== */
  html,body{
    background:#000 !important;
  }
  .ambient-glow, .gx-grid, .gx-scanline{display:none !important;}

  :root{
    --lg-bg:#000000;
    --lg-card:#0b0b0d;
    --lg-border:rgba(255,255,255,0.14);
    --lg-border-soft:rgba(255,255,255,0.08);
    --lg-input:rgba(255,255,255,0.03);
    --lg-text:#f2f2f4;
    --lg-text-dim:#8a8a92;
    --lg-danger:#ff5470;
    --lg-success:#3ddc84;
    --lg-font:'Chakra Petch','Noto Sans Thai', sans-serif;
  }

  .wrap{position:relative;z-index:2;max-width:480px;}

  .back-row{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .back-btn{
    width:38px;height:38px;border-radius:10px;flex-shrink:0;
    background:var(--lg-input);border:1px solid var(--lg-border-soft);
    color:var(--lg-text);display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:18px;transition:border-color .2s ease, transform .15s ease;
  }
  .back-btn:hover{border-color:var(--lg-border);}
  .back-btn:active{transform:scale(0.94);}
  .page-title{font-family:var(--lg-font);font-size:18px;font-weight:700;color:var(--lg-text);margin:0;letter-spacing:0.2px;}

  /* ===== card ===== */
  .gx-card{
    max-width:440px;margin:8px auto 0;
    border-radius:16px;
    background:var(--lg-card);
    border:1px solid var(--lg-border);
  }
  .gx-card-inner{
    padding:28px 22px 24px;
  }

  .gx-title{
    font-family:var(--lg-font);font-weight:700;font-size:23px;
    text-align:center;margin:0 0 6px;letter-spacing:0.2px;color:var(--lg-text);
  }
  .gx-sub{
    text-align:center;font-size:13px;color:var(--lg-text-dim);margin:0 0 22px;
    font-family:'Noto Sans Thai', sans-serif;
  }

  /* ===== google button ===== */
  .gx-google-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:13px 14px;border-radius:10px;border:1px solid var(--lg-border);
    background:transparent;color:var(--lg-text);font-weight:600;font-size:.92rem;cursor:pointer;
    font-family:var(--lg-font);
    transition:border-color .2s ease, background .2s ease;
  }
  .gx-google-btn:hover{background:rgba(255,255,255,0.04);}
  .gx-google-btn:active{transform:scale(0.99);}
  .gx-google-btn:disabled{opacity:.6;cursor:default;}
  .gx-google-btn svg.gmark{width:18px;height:18px;flex-shrink:0;}

  .gx-divider{
    display:flex;align-items:center;gap:12px;margin:18px 0;
    font-size:12px;color:var(--lg-text-dim);letter-spacing:0.3px;
    font-family:'Noto Sans Thai', sans-serif;
  }
  .gx-divider::before,.gx-divider::after{content:'';flex:1;height:1px;background:var(--lg-border-soft);}

  /* ===== fields ===== */
  .gx-field{margin-bottom:16px;}
  .gx-field label{
    display:block;
    margin-bottom:7px;font-size:13.5px;color:var(--lg-text);
    font-family:'Noto Sans Thai', sans-serif;font-weight:600;
  }
  .gx-input-wrap{position:relative;}
  .gx-input-wrap input{
    width:100%;padding:12px 14px;border-radius:10px;
    border:1px solid var(--lg-border);
    background:var(--lg-input);color:var(--lg-text);font-size:0.95rem;
    font-family:'Noto Sans Thai', sans-serif;
    transition:border-color .2s ease;
  }
  .gx-input-wrap input::placeholder{color:#5a5a62;}
  .gx-input-wrap input:focus{
    outline:none;border-color:rgba(255,255,255,0.4);
  }
  .gx-input-wrap.has-toggle input{padding-right:70px;}
  .gx-toggle-eye{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    border:none;background:none;cursor:pointer;
    display:flex;align-items:center;gap:5px;color:var(--lg-text-dim);
    padding:0;font-size:12.5px;font-family:'Noto Sans Thai', sans-serif;
  }
  .gx-toggle-eye:hover{color:var(--lg-text);}
  .gx-toggle-eye svg{width:16px;height:16px;stroke:currentColor;}

  /* ===== remember-me row ===== */
  .gx-remember-row{
    display:flex;align-items:center;justify-content:space-between;
    margin:-4px 0 18px;font-size:13px;font-family:'Noto Sans Thai', sans-serif;
  }
  .gx-remember{display:flex;align-items:center;gap:8px;color:var(--lg-text-dim);cursor:pointer;user-select:none;}
  .gx-remember input[type="checkbox"]{
    width:16px;height:16px;accent-color:#fff;cursor:pointer;margin:0;
  }
  .gx-forgot{color:var(--lg-text-dim);text-decoration:underline;text-underline-offset:2px;cursor:pointer;background:none;border:none;font-size:13px;font-family:'Noto Sans Thai', sans-serif;padding:0;}
  .gx-forgot:hover{color:var(--lg-text);}

  /* ===== submit button ===== */
  .gx-submit{
    width:100%;margin-top:2px;border:none;border-radius:10px;padding:13px;
    background:#e6e6e9;
    color:#111;font-weight:700;font-size:14.5px;
    font-family:var(--lg-font);letter-spacing:0.3px;
    cursor:pointer;transition:background .2s ease, opacity .2s ease;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .gx-submit:hover{background:#fff;}
  .gx-submit:active{transform:scale(0.99);}
  .gx-submit:disabled{opacity:.6;cursor:default;}

  .gx-spinner{
    width:15px;height:15px;border-radius:50%;
    border:2px solid rgba(0,0,0,0.2);
    border-top-color:#111;
    animation:gxSpin .7s linear infinite;
    display:none;
  }
  @keyframes gxSpin{to{transform:rotate(360deg);}}
  .gx-submit.loading .gx-spinner{display:inline-block;}
  .gx-submit.loading .gx-submit-label{opacity:.6;}

  /* ===== message row ===== */
  .gx-msg{
    display:flex;align-items:center;gap:7px;justify-content:center;
    margin-top:14px;font-size:13px;min-height:1.4em;
    opacity:0;transform:translateY(-4px);
    transition:opacity .25s ease, transform .25s ease;
    font-family:'Noto Sans Thai', sans-serif;
  }
  .gx-msg.show{opacity:1;transform:translateY(0);}
  .gx-msg svg{width:15px;height:15px;flex-shrink:0;}
  .gx-msg.error{color:var(--lg-danger);}
  .gx-msg.success{color:var(--lg-success);}
  .gx-msg.pending{color:var(--lg-text-dim);}

  /* ===== bottom switch link ===== */
  .gx-switch{
    text-align:center;margin-top:20px;font-size:13.5px;color:var(--lg-text-dim);
    font-family:'Noto Sans Thai', sans-serif;
  }
  .gx-switch a{color:var(--lg-text);font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer;}
  .gx-switch a:hover{color:#fff;}
</style>
</head>
<body>
<div class="wrap">

  <div class="page-crumbs">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      ໜ້າແຮກ
    </a>
    <span class="crumb-sep">›</span>
    <span class="crumb-current">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      ເຂົ້າສູ່ລະບົບ
    </span>
  </div>

  <div class="back-row">
    <button class="back-btn" id="backBtn" aria-label="ກັບຄືນ">←</button>
    <h1 class="page-title">ບັນຊີຂອງຂ້ອຍ</h1>
  </div>

  <div class="gx-card">
    <div class="gx-card-inner">

      <h2 class="gx-title" id="formTitle">ເຂົ້າສູ່ລະບົບ</h2>
      <p class="gx-sub" id="formSub">ກະລຸນາເຂົ້າສູ່ລະບົບເພື່ອໃຊ້ງານຕໍ່</p>

      <!-- LOGIN FORM -->
      <form id="loginForm">
        <div class="gx-field">
          <label for="loginEmail">ອີເມວ</label>
          <div class="gx-input-wrap">
            <input type="email" id="loginEmail" required placeholder="you@example.com">
          </div>
        </div>
        <div class="gx-field">
          <label for="loginPassword">ລະຫັດຜ່ານ</label>
          <div class="gx-input-wrap has-toggle">
            <input type="password" id="loginPassword" required placeholder="••••••••">
            <button type="button" class="gx-toggle-eye" data-target="loginPassword" aria-label="ສະແດງ/ເຊື່ອງລະຫັດຜ່ານ">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <span class="toggle-label">ສະແດງ</span>
            </button>
          </div>
        </div>

        <div class="gx-remember-row">
          <label class="gx-remember">
            <input type="checkbox" id="rememberMe" checked>
            ຈື່ຈຳການເຂົ້າສູ່ລະບົບ
          </label>
          <button type="button" class="gx-forgot" id="forgotBtn">ລືມລະຫັດຜ່ານ?</button>
        </div>

        <button type="submit" class="gx-submit" id="loginSubmit">
          <span class="gx-spinner"></span>
          <span class="gx-submit-label">ເຂົ້າສູ່ລະບົບ</span>
        </button>
        <div class="gx-msg" id="loginMsg"></div>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" style="display:none">
        <div class="gx-field">
          <label for="regEmail">ອີເມວ</label>
          <div class="gx-input-wrap">
            <input type="email" id="regEmail" required placeholder="you@example.com">
          </div>
        </div>
        <div class="gx-field">
          <label for="regPassword">ລະຫັດຜ່ານ (ຢ່າງໜ້ອຍ 6 ໂຕອັກສອນ)</label>
          <div class="gx-input-wrap has-toggle">
            <input type="password" id="regPassword" required minlength="6" placeholder="••••••••">
            <button type="button" class="gx-toggle-eye" data-target="regPassword" aria-label="ສະແດງ/ເຊື່ອງລະຫັດຜ່ານ">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <span class="toggle-label">ສະແດງ</span>
            </button>
          </div>
        </div>
        <div class="gx-field">
          <label for="regPassword2">ຢືນຢັນລະຫັດຜ່ານ</label>
          <div class="gx-input-wrap has-toggle">
            <input type="password" id="regPassword2" required minlength="6" placeholder="••••••••">
            <button type="button" class="gx-toggle-eye" data-target="regPassword2" aria-label="ສະແດງ/ເຊື່ອງລະຫັດຜ່ານ">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <span class="toggle-label">ສະແດງ</span>
            </button>
          </div>
        </div>

        <button type="submit" class="gx-submit" id="registerSubmit">
          <span class="gx-spinner"></span>
          <span class="gx-submit-label">ສະໝັກສະມາຊິກ</span>
        </button>
        <div class="gx-msg" id="registerMsg"></div>
      </form>

      <div class="gx-divider">ຫຼື</div>

      <button type="button" class="gx-google-btn" id="googleBtn">
        <svg class="gmark" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.4 5.9 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.4 5.9 29.5 4 24 4c-7.6 0-14.2 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-1.8 13.9-5l-6.4-5.4c-2 1.4-4.6 2.4-7.5 2.4-5.3 0-9.8-3.4-11.4-8.1l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.7 2.1-2.1 3.9-3.9 5.2l6.4 5.4C41.4 36 44 30.6 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        ເຂົ້າສູ່ລະບົບດ້ວຍ Google
      </button>

      <p class="gx-switch" id="switchToRegister">ຍັງບໍ່ມີບັນຊີ? <a id="goRegister">ສະໝັກສະມາຊິກ</a></p>
      <p class="gx-switch" id="switchToLogin" style="display:none">ມີບັນຊີແລ້ວ? <a id="goLogin">ເຂົ້າສູ່ລະບົບ</a></p>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg><span class="toggle-label">ສະແດງ</span>';
  const ICON_EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 4.22-5.06M9.9 4.24A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a20.5 20.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg><span class="toggle-label">ເຊື່ອງ</span>';
  const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg>';
  const ICON_ERR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>';

  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', () => { window.location.href = 'index.html'; });

  // ---- password visibility toggles ----
  document.querySelectorAll('.gx-toggle-eye').forEach(btn => {
    btn.innerHTML = ICON_EYE;
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      if (!input) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = show ? ICON_EYE_OFF : ICON_EYE;
    });
  });

  // ---- login / register switch (bottom link, no tabs) ----
  const formTitle = document.getElementById('formTitle');
  const formSub = document.getElementById('formSub');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const switchToRegister = document.getElementById('switchToRegister');
  const switchToLogin = document.getElementById('switchToLogin');

  function showLogin() {
    loginForm.style.display = 'block';
    registerForm.style.display = 'none';
    switchToRegister.style.display = 'block';
    switchToLogin.style.display = 'none';
    formTitle.textContent = 'ເຂົ້າສູ່ລະບົບ';
    formSub.textContent = 'ກະລຸນາເຂົ້າສູ່ລະບົບເພື່ອໃຊ້ງານຕໍ່';
  }
  function showRegister() {
    registerForm.style.display = 'block';
    loginForm.style.display = 'none';
    switchToLogin.style.display = 'block';
    switchToRegister.style.display = 'none';
    formTitle.textContent = 'ສະໝັກສະມາຊິກ';
    formSub.textContent = 'ສ້າງບັນຊີໃໝ່ເພື່ອເລີ່ມໃຊ້ງານ';
  }
  document.getElementById('goRegister').addEventListener('click', showRegister);
  document.getElementById('goLogin').addEventListener('click', showLogin);

  // ຖ້າມາຈາກລິ້ງ ?mode=register (ປຸ່ມ "ສະໝັກສະມາຊິກ" ໃນເມນູ) ໃຫ້ເປີດຟອມສະໝັກອັດຕະໂນມັດ
  if (new URLSearchParams(window.location.search).get('mode') === 'register') {
    showRegister();
  }

  // ---- forgot password (placeholder — no backend flow wired up yet) ----
  document.getElementById('forgotBtn').addEventListener('click', () => {
    setMsg(document.getElementById('loginMsg'), 'ກະລຸນາຕິດຕໍ່ແອັດມິນເພື່ອຣີເຊັດລະຫັດຜ່ານ', 'pending');
  });

  // ---- helpers ----
  function setMsg(el, text, kind) {
    el.classList.remove('show', 'error', 'success', 'pending');
    if (!text) return;
    const icon = kind === 'error' ? ICON_ERR : kind === 'success' ? ICON_OK : '';
    el.innerHTML = icon + '<span>' + text + '</span>';
    el.classList.add('show', kind);
  }
  // ແປຂໍ້ຄວາມ error ພາສາອັງກິດຈາກ Supabase ໃຫ້ເປັນພາສາລາວທີ່ເຂົ້າໃຈງ່າຍ
  function translateAuthError(error) {
    const raw = (error && error.message) ? error.message : '';
    const msg = raw.toLowerCase();
    if (msg.includes('user already registered') || msg.includes('already registered') || msg.includes('already exists')) {
      return 'ອີເມວນີ້ຖືກສະໝັກໄວ້ແລ້ວ ກະລຸນາເຂົ້າສູ່ລະບົບແທນ ຫຼືໃຊ້ອີເມວອື່ນ';
    }
    if (msg.includes('invalid login credentials')) {
      return 'ອີເມວ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ';
    }
    if (msg.includes('email not confirmed')) {
      return 'ອີເມວນີ້ຍັງບໍ່ໄດ້ຢືນຢັນ ກະລຸນາເຂົ້າໄປກວດອີເມວເພື່ອຢືນຢັນກ່ອນ';
    }
    if (msg.includes('password should be at least') || msg.includes('at least 6 characters')) {
      return 'ລະຫັດຜ່ານຕ້ອງມີຢ່າງໜ້ອຍ 6 ໂຕອັກສອນ';
    }
    if (msg.includes('unable to validate email address') || msg.includes('invalid email')) {
      return 'ຮູບແບບອີເມວບໍ່ຖືກຕ້ອງ ກະລຸນາກວດເບິ່ງອີກຄັ້ງ';
    }
    if (msg.includes('rate limit') || msg.includes('too many requests')) {
      return 'ມີການພະຍາຍາມຫຼາຍເກີນໄປ ກະລຸນາລໍຖ້າສັກຄູ່ແລ້ວລອງໃໝ່';
    }
    if (msg.includes('failed to fetch') || msg.includes('network')) {
      return 'ເຊື່ອມຕໍ່ອິນເຕີເນັດບໍ່ໄດ້ ກະລຸນາກວດສອບການເຊື່ອມຕໍ່ແລ້ວລອງໃໝ່';
    }
    // ບໍ່ຮູ້ຈັກຂໍ້ຄວາມ error ນີ້ -> ສະແດງຂໍ້ຄວາມເດີມ ແຕ່ຫຸ້ມດ້ວຍປະໂຫຍກລາວ
    return raw ? ('ມີບັນຫາເກີດຂຶ້ນ: ' + raw) : 'ມີບັນຫາເກີດຂຶ້ນ ກະລຸນາລອງໃໝ່ພາຍຫຼັງ';
  }
  function setLoading(btn, loading) {
    btn.disabled = loading;
    btn.classList.toggle('loading', loading);
  }

  // ---- redirect if already logged in ----
  function redirectAfterAuth() {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');
    window.location.href = redirect || 'index.html';
  }
  getCurrentUser().then(user => { if (user) redirectAfterAuth(); });

  // ---- Google OAuth ----
  const googleBtn = document.getElementById('googleBtn');
  googleBtn.addEventListener('click', async () => {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect') || 'index.html';
    googleBtn.disabled = true;
    googleBtn.textContent = 'ກຳລັງພາໄປ Google...';
    const { error } = await signInWithGoogle(redirect);
    if (error) {
      setMsg(document.getElementById('loginMsg'), translateAuthError(error), 'error');
      googleBtn.disabled = false;
      googleBtn.textContent = 'ເຂົ້າສູ່ລະບົບດ້ວຍ Google';
    }
  });

  // ---- Login ----
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('loginMsg');
    const btn = document.getElementById('loginSubmit');
    setMsg(msg, 'ກຳລັງເຂົ້າສູ່ລະບົບ...', 'pending');
    setLoading(btn, true);

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    const { error } = await signIn(email, password);
    setLoading(btn, false);
    if (error) {
      setMsg(msg, translateAuthError(error), 'error');
    } else {
      setMsg(msg, 'ເຂົ້າສູ່ລະບົບສຳເລັດ ກຳລັງພາໄປ...', 'success');
      setTimeout(redirectAfterAuth, 450);
    }
  });

  // ---- Register ----
  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('registerMsg');
    const btn = document.getElementById('registerSubmit');
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const password2 = document.getElementById('regPassword2').value;

    if (password !== password2) {
      setMsg(msg, 'ລະຫັດຜ່ານທັງສອງຊ່ອງບໍ່ກົງກັນ', 'error');
      return;
    }

    setMsg(msg, 'ກຳລັງສະໝັກສະມາຊິກ...', 'pending');
    setLoading(btn, true);

    const { error } = await signUp(email, password);
    setLoading(btn, false);
    if (error) {
      setMsg(msg, translateAuthError(error), 'error');
      const rawMsg = (error.message || '').toLowerCase();
      if (rawMsg.includes('already registered') || rawMsg.includes('already exists')) {
        // ອີເມວນີ້ມີບັນຊີຢູ່ແລ້ວ -> ຊ່ວຍພາຜູ້ໃຊ້ໄປຟອມເຂົ້າສູ່ລະບົບພ້ອມຕື່ມອີເມວໃຫ້ອັດຕະໂນມັດ
        setTimeout(() => {
          showLogin();
          document.getElementById('loginEmail').value = email;
          setMsg(document.getElementById('loginMsg'), 'ອີເມວນີ້ມີບັນຊີຢູ່ແລ້ວ ກະລຸນາໃສ່ລະຫັດຜ່ານເພື່ອເຂົ້າສູ່ລະບົບ', 'pending');
        }, 1400);
      }
    } else {
      setMsg(msg, 'ສະໝັກສຳເລັດ! ຖ້າເປີດການຢືນຢັນອີເມວໄວ້ ກະລຸນາກວດເບິ່ງອີເມວກ່ອນເຂົ້າສູ່ລະບົບ', 'success');
    }
  });
});
</script>
</body>
</html>
