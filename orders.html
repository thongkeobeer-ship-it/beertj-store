<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ປະຫວັດການສັ່ງຊື້</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* ສະໄຕລ໌ເພີ່ມສະເພາະໜ້ານີ້ (ບໍ່ໄປແກ້ style.css ຫຼັກ) */
  .orders-list{ display:flex; flex-direction:column; gap:12px; margin-top:16px; }
  .order-card{
    background: var(--card-bg, rgba(255,255,255,0.04));
    border: 1px solid rgba(184,134,11,0.18);
    border-radius: 16px;
    padding: 14px 16px;
    display:flex; flex-direction:column; gap:8px;
  }
  .order-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .order-card-name{ font-weight:700; font-size:15px; }
  .order-card-meta{ font-size:12.5px; opacity:0.7; margin-top:2px; }
  .order-card-total{ font-weight:700; white-space:nowrap; }
  .order-card-bottom{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .order-card-ref{ font-size:11.5px; opacity:0.55; margin-top:4px; }
  .order-status{
    font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px;
    background:rgba(32,181,106,0.14); color:#20b56a;
  }
  .order-status[data-status="pending"]{ background:rgba(255,196,0,0.14); color:#c88a00; }
  .order-status[data-status="rejected"]{ background:rgba(255,90,90,0.14); color:#e0455a; }
  .view-code-btn{
    font-size:12.5px; font-weight:700; padding:6px 14px; border-radius:10px;
    border:1px solid rgba(184,134,11,0.35); background:transparent; color:#b8860b;
    cursor:pointer;
  }
  .empty-note{ text-align:center; opacity:0.6; padding:40px 10px; font-size:14px; }
  .loading-note{ text-align:center; opacity:0.6; padding:40px 10px; font-size:14px; }

  .code-box{
    background:rgba(184,134,11,0.08); border:1px dashed rgba(184,134,11,0.4);
    border-radius:12px; padding:12px 14px; margin:14px 0;
    font-family: monospace; font-size:14px; white-space:pre-wrap; word-break:break-all;
    text-align:left; max-height:160px; overflow-y:auto;
  }
  .copy-code-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font-size:13px; font-weight:700; padding:8px 16px; border-radius:10px;
    border:none; background:#b8860b; color:#fff; cursor:pointer; margin-top:4px;
  }

  /* ===== ANIMATION — ป๊อปอัพ "ซื้อสำเร็จ / ดูรหัส" (ขอบเขตเฉพาะหน้านี้) ===== */
  @keyframes codeIconPop{
    0%{ opacity:0; filter:blur(7px); transform:scale(.35) translateY(8px) rotate(0deg); }
    55%{ opacity:1; filter:blur(0); transform:scale(1.16) translateY(0) rotate(0deg); }
    70%{ transform:scale(.9) rotate(-6deg); }
    82%{ transform:scale(1.07) rotate(5deg); }
    92%{ transform:scale(.97) rotate(-2deg); }
    100%{ opacity:1; filter:blur(0); transform:scale(1) rotate(0deg); }
  }
  #codeOverlay .success-icon{
    opacity:0;
  }
  #codeOverlay .success-icon.pop-in{
    animation: codeIconPop .65s cubic-bezier(.26,.85,.35,1.2) both;
  }
  #codeOverlay .success-card h3,
  #codeOverlay .success-card p{
    min-height:1.2em;
  }
  /* ປຸ່ມ "ຄັດລອກ" ແລະ "ปิด" ມາຢູ່ແຖວດຽວກັນ, ปุ่มปิดสั้นลง, ซ่อนไว้ก่อนจนกว่าไอคอนจะเด้งเสร็จ */
  .success-actions{
    display:flex; align-items:stretch; gap:10px;
    opacity:0; transform:translateY(6px);
    transition:opacity .3s ease, transform .3s ease;
    pointer-events:none;
  }
  .success-actions.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  #codeOverlay .copy-code-btn{ flex:1; margin-top:0; }
  #codeOverlay .success-close{ width:auto; flex:0 0 88px; margin-top:0; }
  @media (prefers-reduced-motion: reduce){
    #codeOverlay .success-icon.pop-in{ animation:none !important; opacity:1 !important; filter:none !important; transform:none !important; }
    .success-actions{ transition:none !important; opacity:1 !important; transform:none !important; pointer-events:auto !important; }
  }
</style>
</head>
<body>
<div class="ambient-glow">
  <div class="orb orb-gold"></div>
  <div class="orb orb-navy"></div>
  <div class="orb orb-gold-soft"></div>
</div>
<div class="wrap">

  <div class="page-crumbs">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      ໜ້າແຮກ
    </a>
    <span class="crumb-sep">›</span>
    <span class="crumb-current">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><polyline points="3.3 7 12 12 20.7 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>
      ປະຫວັດການສັ່ງຊື້
    </span>
  </div>

  <div class="back-row">
    <button class="back-btn" id="backBtn" aria-label="ກັບຄືນ">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="page-title">ປະຫວັດການສັ່ງຊື້</h1>
  </div>

  <div id="ordersList" class="orders-list">
    <div class="loading-note">ກຳລັງໂຫຼດ...</div>
  </div>

</div>

<!-- POPUP ໂຊວ໌ລະຫັດ -->
<div class="success-overlay" id="codeOverlay">
  <div class="success-card">
    <div class="success-icon" id="codeOverlayIcon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
    </div>
    <h3 id="codeOverlayTitle">ຊື້ສຳເລັດແລ້ວ</h3>
    <p id="codeOverlayText">ນີ້ແມ່ນລະຫັດຂອງທ່ານ</p>
    <div class="code-box" id="codeOverlayCode">-</div>
    <div class="success-actions" id="codeOverlayActions">
      <button class="copy-code-btn" id="copyCodeBtn">ຄັດລອກລະຫັດ</button>
      <button class="success-close" id="codeOverlayClose">ປິດ</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="orders.js"></script>
</body>
</html>
