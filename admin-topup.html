<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ຄຳຂໍເຕີມເງິນ — ແອດມິນ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient-glow">
  <div class="orb orb-gold"></div>
  <div class="orb orb-navy"></div>
  <div class="orb orb-gold-soft"></div>
</div>
<div class="wrap">

  <div class="back-row">
    <button class="back-btn" id="backBtn" aria-label="ກັບຄືນ">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="page-title">ຄຳຂໍເຕີມເງິນ</h1>
  </div>

  <!-- STAT ຫຍໍ້ -->
  <div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:26px;">
    <div class="stat-card">
      <div class="stat-num" id="statPending">0</div>
      <div class="stat-label">ລໍຖ້າກວດສອບ</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statApproved">0</div>
      <div class="stat-label">ອະນຸມັດແລ້ວ</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statRejected">0</div>
      <div class="stat-label">ປະຕິເສດ</div>
    </div>
  </div>

  <div class="section-head">
    <h2>ລາຍການລໍຖ້າກວດສອບ</h2>
  </div>

  <div class="admin-topup-list" id="topupList">
    <div class="empty-note" id="topupEmpty">ກຳລັງໂຫຼດ...</div>
  </div>

</div>

<!-- MODAL ເບິ່ງສະລິບຂະໜາດໃຫຍ່ -->
<div class="slip-modal" id="slipModal">
  <img id="slipModalImg" alt="ສະລິບ">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="admin-topup.js"></script>
</body>
</html>
