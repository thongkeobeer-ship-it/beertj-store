<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ຫ້ອງຄວບຄຸມແອດມິນ</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gx-signal:#5b8cff;
    --gx-signal-soft:rgba(91,140,255,0.35);
    --gx-signal-dim:rgba(91,140,255,0.16);
    --gx-danger:#ff5470;
    --gx-success:#3ddc84;
    --gx-font:'Chakra Petch', 'Noto Sans Thai', sans-serif;
  }

  .gx-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(91,140,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,140,255,0.06) 1px, transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 20%, #000 0%, transparent 75%);
            mask-image:radial-gradient(ellipse 70% 55% at 50% 20%, #000 0%, transparent 75%);
    opacity:0.8;
  }
  .gx-scanline{
    position:fixed;left:0;right:0;height:140px;z-index:1;pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(91,140,255,0.05) 45%, rgba(91,140,255,0.09) 50%, rgba(91,140,255,0.05) 55%, transparent);
    animation:gxScan 7s linear infinite;
  }
  @keyframes gxScan{ 0%{top:-140px;} 100%{top:100vh;} }
  @media (prefers-reduced-motion: reduce){ .gx-scanline{animation:none;display:none;} }

  .wrap{position:relative;z-index:2;}
  .back-btn{transition:border-color .2s ease, box-shadow .2s ease, transform .15s ease;}
  .back-btn:hover{border-color:var(--gx-signal-soft);box-shadow:0 0 0 3px var(--gx-signal-dim);}
  .back-btn:active{transform:scale(0.94);}
  .page-title{font-family:var(--gx-font);letter-spacing:0.4px;}

  /* ===== gate: shown while checking admin access ===== */
  #gate{ text-align:center; padding:70px 10px; color:var(--ink-300); font-size:13.5px; }
  #gate .gx-spinner-lg{
    width:34px;height:34px;border-radius:50%;margin:0 auto 16px;
    border:3px solid rgba(232,232,238,0.18); border-top-color:var(--gx-signal);
    animation:gxSpin .8s linear infinite;
  }
  @keyframes gxSpin{ to{transform:rotate(360deg);} }

  #adminApp{ display:none; }

  /* ===== status strip — signature element: a live "operations" readout ===== */
  .ops-strip{
    display:flex; gap:10px; margin:6px 0 18px; overflow-x:auto; padding-bottom:2px;
  }
  .ops-chip{
    flex-shrink:0; display:flex; flex-direction:column; gap:2px;
    padding:10px 16px; border-radius:14px;
    background:linear-gradient(165deg, rgba(17,28,56,0.85), rgba(5,9,20,0.9));
    border:1px solid rgba(154,154,164,0.18);
    min-width:96px;
  }
  .ops-chip .ops-num{ font-family:var(--gx-font); font-weight:700; font-size:19px; color:var(--shine); }
  .ops-chip .ops-label{ font-size:10.5px; color:var(--ink-500); letter-spacing:0.4px; }

  /* ===== tabs (3-way) ===== */
  .gx-tabs3{
    position:relative;display:flex;
    border:1px solid rgba(154,154,164,0.18);
    border-radius:12px;padding:4px;margin-bottom:20px;
    background:rgba(255,255,255,0.02);
  }
  .gx-tab-slider3{
    position:absolute;top:4px;bottom:4px;left:4px;
    width:calc(33.333% - 5.33px);border-radius:9px;
    background:linear-gradient(135deg,var(--black-300),var(--black-500));
    border:1px solid rgba(91,140,255,0.4);
    box-shadow:0 0 14px -3px var(--gx-signal-soft);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
  }
  .gx-tab3{
    position:relative;z-index:1;flex:1;text-align:center;padding:9px 4px;
    font-family:var(--gx-font);font-weight:600;font-size:12px;letter-spacing:0.2px;
    color:var(--ink-500);cursor:pointer;transition:color .2s ease;
  }
  .gx-tab3.active{color:var(--shine);}

  .panel{ display:none; }
  .panel.active{ display:block; }

  /* ===== static card (no rotating border, for content-heavy panels) ===== */
  .stat-panel{
    border-radius:18px;
    background:linear-gradient(165deg, rgba(17,28,56,0.92), rgba(5,9,20,0.97));
    border:1px solid rgba(154,154,164,0.16);
    padding:20px 18px;margin-bottom:16px;
  }
  .stat-panel h3{
    font-family:var(--gx-font); font-size:14.5px; margin:0 0 14px;
    display:flex;align-items:center;gap:8px;color:var(--ink-100);
  }
  .stat-panel h3 svg{width:16px;height:16px;stroke:var(--gx-signal);}

  /* fields reused from login.html */
  .gx-field{margin-bottom:14px;}
  .gx-field label{
    display:flex;align-items:center;gap:6px;
    margin-bottom:6px;font-size:11.5px;color:var(--ink-300);
    font-family:var(--gx-font);letter-spacing:0.5px;text-transform:uppercase;
  }
  .gx-input-wrap input, .gx-input-wrap textarea, .gx-input-wrap select{
    width:100%;padding:12px 14px;border-radius:10px;
    border:1px solid rgba(154,154,164,0.16);
    background:rgba(255,255,255,0.02);color:var(--ink-100);font-size:0.95rem;
    font-family:'Noto Sans Thai', sans-serif;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .gx-input-wrap textarea{resize:vertical;min-height:96px;line-height:1.5;}
  .gx-input-wrap input::placeholder, .gx-input-wrap textarea::placeholder{color:var(--ink-500);}
  .gx-input-wrap input:focus, .gx-input-wrap textarea:focus, .gx-input-wrap select:focus{
    outline:none;border-color:var(--gx-signal);
    box-shadow:0 0 0 3px var(--gx-signal-dim);
  }
  .gx-row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .gx-submit{
    position:relative;overflow:hidden;
    width:100%;margin-top:6px;border:none;border-radius:12px;padding:13px;
    background:linear-gradient(135deg,var(--black-300),var(--black-500));
    color:var(--shine);font-weight:700;font-size:14.5px;
    font-family:var(--gx-font);letter-spacing:0.5px;
    border:1px solid rgba(91,140,255,0.35);
    cursor:pointer;transition:transform .15s ease, box-shadow .2s ease;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .gx-submit:hover{box-shadow:0 0 20px -4px var(--gx-signal-soft);}
  .gx-submit:active{transform:scale(0.98);}
  .gx-submit:disabled{opacity:.6;cursor:default;}
  .gx-submit.danger{ border-color:rgba(255,84,112,0.4); }
  .gx-spinner{
    width:15px;height:15px;border-radius:50%;
    border:2px solid rgba(232,232,238,0.25); border-top-color:var(--shine);
    animation:gxSpin .7s linear infinite; display:none;
  }
  .gx-submit.loading .gx-spinner{display:inline-block;}
  .gx-submit.loading .gx-submit-label{opacity:.6;}

  .gx-msg{
    display:flex;align-items:center;gap:7px;justify-content:center;
    margin-top:12px;font-size:13px;min-height:1.4em;
    opacity:0;transform:translateY(-4px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .gx-msg.show{opacity:1;transform:translateY(0);}
  .gx-msg.error{color:var(--gx-danger);}
  .gx-msg.success{color:var(--gx-success);}
  .gx-msg.pending{color:var(--ink-300);}

  /* ===== image dropzone ===== */
  .drop-zone{
    border:1.5px dashed rgba(154,154,164,0.35); border-radius:14px;
    padding:18px; text-align:center; cursor:pointer;
    color:var(--ink-500); font-size:12.5px;
    transition:border-color .2s ease, background .2s ease;
    position:relative; overflow:hidden;
  }
  .drop-zone:hover{ border-color:var(--gx-signal-soft); background:rgba(91,140,255,0.04); }
  .drop-zone.has-image{ padding:0; border-style:solid; }
  .drop-zone img{ width:100%; max-height:200px; object-fit:cover; display:block; border-radius:12px; }
  .drop-zone input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }

  /* ===== product management list ===== */
  .prod-row{
    display:flex; gap:12px; align-items:flex-start;
    padding:14px 0; border-bottom:1px solid rgba(154,154,164,0.12);
  }
  .prod-row:last-child{ border-bottom:none; }
  .prod-thumb{
    width:56px;height:56px;border-radius:10px;flex-shrink:0;
    background:rgba(255,255,255,0.03); border:1px solid rgba(154,154,164,0.18);
    object-fit:cover;
  }
  .prod-fields{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .prod-fields .gx-row2 input{ padding:9px 10px; font-size:0.88rem; }
  .prod-meta-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .prod-stock{ font-size:11px; color:var(--ink-500); white-space:nowrap; }
  .prod-actions{ display:flex; gap:8px; }
  .icon-btn{
    width:34px;height:34px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.03); border:1px solid rgba(154,154,164,0.2);
    color:var(--ink-300); cursor:pointer; transition:all .15s ease;
  }
  .icon-btn:hover{ border-color:var(--gx-signal-soft); color:var(--shine); }
  .icon-btn.save-btn:hover{ border-color:rgba(61,220,132,0.5); color:var(--gx-success); }
  .icon-btn.del-btn:hover{ border-color:rgba(255,84,112,0.5); color:var(--gx-danger); }
  .icon-btn svg{ width:15px;height:15px;stroke:currentColor; }
  .empty-note{ text-align:center; color:var(--ink-500); font-size:13px; padding:24px 0; }

  select#codeProductSelect{ appearance:none; -webkit-appearance:none; }
</style>
</head>
<body>
<div class="ambient-glow">
  <div class="orb orb-gold"></div>
  <div class="orb orb-navy"></div>
  <div class="orb orb-gold-soft"></div>
</div>
<div class="gx-grid"></div>
<div class="gx-scanline"></div>

<div class="wrap">

  <div class="back-row">
    <button class="back-btn" id="backBtn" aria-label="ກັບຄືນ">←</button>
    <h1 class="page-title">ຫ້ອງຄວບຄຸມແອດມິນ</h1>
  </div>

  <div id="gate">
    <div class="gx-spinner-lg"></div>
    <div>ກຳລັງກວດສອບສິດເຂົ້າໃຊ້...</div>
  </div>

  <div id="adminApp">

    <div class="ops-strip" id="opsStrip"></div>

    <div class="gx-tabs3">
      <div class="gx-tab-slider3" id="tabSlider3"></div>
      <div class="gx-tab3 active" data-panel="panelAdd">ເພີ່ມສິນຄ້າ</div>
      <div class="gx-tab3" data-panel="panelManage">ຈັດການສິນຄ້າ</div>
      <div class="gx-tab3" data-panel="panelCodes">ເຕີມລະຫັດ</div>
    </div>

    <!-- ===== PANEL 1: ເພີ່ມສິນຄ້າ ===== -->
    <div class="panel active" id="panelAdd">
      <div class="stat-panel">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          ເພີ່ມສິນຄ້າໃໝ່
        </h3>
        <form id="addForm">
          <div class="gx-field">
            <label>ຮູບສິນຄ້າ</label>
            <div class="drop-zone" id="dropZone">
              <span id="dropZoneText">ແຕະເພື່ອເລືອກຮູບພາບ</span>
              <input type="file" id="imageInput" accept="image/*">
            </div>
          </div>
          <div class="gx-field">
            <label>ຊື່ສິນຄ້າ</label>
            <div class="gx-input-wrap"><input type="text" id="pName" required placeholder="ຕົວຢ່າງ: ບັດເຕີມເງິນ 100 ບາດ"></div>
          </div>
          <div class="gx-row2">
            <div class="gx-field">
              <label>ໝວດໝູ່</label>
              <div class="gx-input-wrap"><input type="text" id="pCategory" placeholder="ໝວດໝູ່ສິນຄ້າ"></div>
            </div>
            <div class="gx-field">
              <label>ລາຄາ (ບາດ)</label>
              <div class="gx-input-wrap"><input type="number" id="pPrice" required min="0" step="0.01" placeholder="0"></div>
            </div>
          </div>
          <button type="submit" class="gx-submit" id="addSubmit">
            <span class="gx-spinner"></span>
            <span class="gx-submit-label">ເພີ່ມສິນຄ້າ</span>
          </button>
          <div class="gx-msg" id="addMsg"></div>
        </form>
      </div>
    </div>

    <!-- ===== PANEL 2: ແກ້ໄຂຊື່/ລາຄາ ===== -->
    <div class="panel" id="panelManage">
      <div class="stat-panel">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
          ຈັດການສິນຄ້າ
        </h3>
        <div id="manageList"><div class="empty-note">ກຳລັງໂຫຼດ...</div></div>
      </div>
    </div>

    <!-- ===== PANEL 3: ເຕີມລະຫັດ ===== -->
    <div class="panel" id="panelCodes">
      <div class="stat-panel">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          ເຕີມລະຫັດສິນຄ້າ
        </h3>
        <div class="gx-field">
          <label>ເລືອກສິນຄ້າ</label>
          <div class="gx-input-wrap"><select id="codeProductSelect"></select></div>
        </div>
        <div class="gx-field">
          <label>ລະຫັດ (ໜຶ່ງແຖວຕໍ່ໜຶ່ງລະຫັດ)</label>
          <div class="gx-input-wrap"><textarea id="codesInput" placeholder="ABCD-1234&#10;EFGH-5678&#10;IJKL-9012"></textarea></div>
        </div>
        <button type="button" class="gx-submit" id="codesSubmit">
          <span class="gx-spinner"></span>
          <span class="gx-submit-label">ເພີ່ມລະຫັດ</span>
        </button>
        <div class="gx-msg" id="codesMsg"></div>
        <div class="ops-strip" id="codeStockStrip" style="margin-top:16px;"></div>
      </div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
