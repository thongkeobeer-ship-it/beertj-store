<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ยืนยันคำสั่งซื้อ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient-glow">
  <div class="orb orb-gold"></div>
  <div class="orb orb-navy"></div>
  <div class="orb orb-gold-soft"></div>
</div>

<div class="wrap">

  <!-- BACK + TITLE -->
  <div class="back-row">
    <button class="back-btn" id="backBtn" aria-label="ย้อนกลับ">←</button>
    <h1 class="page-title">ยืนยันคำสั่งซื้อ</h1>
  </div>

  <!-- ORDER HERO -->
  <div class="order-hero">
    <div class="order-check">🛒</div>
    <h2 class="shine-text">ตรวจสอบคำสั่งซื้อ</h2>
    <p>เช็กรายละเอียดให้ครบก่อนกดยืนยัน</p>
  </div>

  <!-- PRODUCT SUMMARY -->
  <div class="order-product">
    <div class="order-thumb" id="orderThumb">รูป</div>
    <div class="order-info">
      <div class="name" id="orderName">ชื่อสินค้าตัวอย่าง</div>
      <div class="meta" id="orderMeta">หมวดหมู่สินค้า • คงเหลือ 0</div>
    </div>
  </div>

  <!-- QUANTITY -->
  <div class="qty-row">
    <div class="qty-label">จำนวน</div>
    <div class="qty-control">
      <button class="qty-btn" id="qtyMinus">−</button>
      <div class="qty-value" id="qtyValue">1</div>
      <button class="qty-btn" id="qtyPlus">+</button>
    </div>
  </div>

  <!-- NOTE -->
  <div class="order-note">
    <label for="orderNote">ข้อมูลเพิ่มเติม (ถ้ามี)</label>
    <textarea id="orderNote" placeholder="เช่น ไอดีเกม, ช่องทางติดต่อ, หมายเหตุอื่นๆ"></textarea>
  </div>

  <!-- SUMMARY -->
  <div class="order-summary">
    <div class="summary-row">
      <span>ราคาต่อชิ้น</span>
      <span id="unitPrice">฿0</span>
    </div>
    <div class="summary-row">
      <span>จำนวน</span>
      <span id="qtyDisplay">x1</span>
    </div>
    <div class="summary-row total">
      <span>รวมทั้งหมด</span>
      <span class="amount shine-text" id="totalPrice">฿0</span>
    </div>
  </div>

  <button class="confirm-btn" id="confirmBtn">✅ ยืนยันการสั่งซื้อ</button>
  <div class="order-id" id="orderId">รหัสคำสั่งซื้อ: —</div>

</div>

<!-- SUCCESS OVERLAY -->
<div class="success-overlay" id="successOverlay">
  <div class="success-card">
    <div class="success-icon">✓</div>
    <h3>สั่งซื้อสำเร็จ</h3>
    <p>ขอบคุณสำหรับคำสั่งซื้อ ทีมงานจะติดต่อกลับเร็วๆ นี้</p>
    <button class="success-close" id="successClose">กลับหน้าหลัก</button>
  </div>
</div>

<script src="checkout.js"></script>
</body>
</html>
